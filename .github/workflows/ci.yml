name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm exec tsc -p packages/react/tsconfig.json --noEmit

      - name: Test React package
        run: pnpm --filter @gryde/react test -- --run

      - name: Build React package
        run: pnpm --filter @gryde/react build

      - name: Build Storybook
        run: pnpm --filter @gryde/docs build
